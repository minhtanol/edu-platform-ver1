name: build-test-deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: education
          POSTGRES_USER: education
          POSTGRES_PASSWORD: education
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U education -d education"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Test backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/education
          SPRING_DATASOURCE_USERNAME: education
          SPRING_DATASOURCE_PASSWORD: education
          REDIS_HOST: localhost
        run: mvn test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Compose build
        env:
          POSTGRES_PASSWORD: education
          JWT_SECRET: ci-only-secret-change-this-secret-change-this-secret
          ADMIN_INITIAL_PASSWORD: Admin@123
          CORS_ORIGINS: http://localhost
        run: docker compose build
